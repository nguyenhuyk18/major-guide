name: major-guide

networks:
  major_guide_nw:
    driver: bridge
    name: major_guide_nw

services: 

  mongodb:
    image : mongo
    container_name: mongodb_major_guide 
    ports: 
      - 27021:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes :
      - ./docker/docker_data/mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - major_guide_nw

  redis: 
    image: redis
    container_name: redis_major_guide
    ports: 
      - '6380:6379'
    networks:
      - major_guide_nw
    restart: unless-stopped
    volumes:
      - ./docker/docker_data/redis_data:/data/db

  redis_insight:
    image: redis/redisinsight:latest
    container_name: redis-ui-major-guide
    ports:
      - "5541:5540"
    volumes:
      - ./docker/docker_data/redisinsight_data:/data
    networks:
      - major_guide_nw
  

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.0
    container_name: keycloak-major-guide-25.0.0
    ports:
      - '8280:8080'
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    restart: unless-stopped
    volumes:
      - ./docker/docker_data/keycloak_data:/opt/keycloak/data
    networks:
      - major_guide_nw
  
  rabbitmq:
    image : rabbitmq:3.12-management
    container_name: rabbitmq_major_guide
    ports:
      - "5672:5672"      
      - "15672:15672"    
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped
    volumes:
      - ./docker/docker_data/rabbitmq_data:/var/lib/rabbitmq
    networks:
      - major_guide_nw

  ollama:
    image: ollama/ollama
    container_name: ollama_major_guide
    ports:
      - "11434:11434"
    volumes:
      - ./docker/docker_data/ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - major_guide_nw