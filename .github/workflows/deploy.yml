# CI/CD cho 8 service NestJS (1 image dùng chung, mỗi ECS service chạy 1 app).
#   push main -> test -> build image -> push ECR (tag = git SHA) -> deploy ECS
# Bước deploy chỉ chạy khi repo variable ECS_DEPLOY_ENABLED = true (bật sau khi đã tạo ECS).
# Repo variables cần có: AWS_ROLE_ARN (từ deploy/aws/setup-cicd.sh)
name: NestJS services CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: nest-cicd
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: majorguide/nest
  ECS_CLUSTER: majorguide

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: false
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t test -p authorizer,bff,booking,chat,mail,media,slot,user-access

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Tag trên ECR là immutable: chạy lại cùng commit thì dùng lại image đã có.
      - id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag=${{ steps.tag.outputs.tag }} >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.found != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.exists.outputs.found != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.nest
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=nest
          cache-to: type=gha,mode=max,scope=nest

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: build
    if: vars.ECS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [authorizer, user-access, booking, slot, chat, media, mail, bff]
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download current task definition
        run: |
          aws ecs describe-task-definition --task-definition majorguide-${{ matrix.service }} \
            --query taskDefinition > task-definition.json
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "IMAGE=$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ needs.build.outputs.tag }}" >> "$GITHUB_ENV"
      - id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ matrix.service }}
          image: ${{ env.IMAGE }}
      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
